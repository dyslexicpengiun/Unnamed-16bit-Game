<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-bit RPG - Matrix Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #game-container { position: relative; width: 800px; height: 600px; margin: auto; border: 4px solid #333; }
        canvas { display: block; }
        
        /* Updated Transition Layer */
        #battle-transition {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 100;
            background: black; /* Fallback */
        }

        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- Matrix Transition Overlay -->
    <div id="battle-transition">
        <canvas id="matrix-canvas"></canvas>
    </div>

    <div id="ui-layer">PRESS 'B' TO TEST BATTLE TRANSITION</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 600;

    // Simple Game Loop for background
    function drawWorld() {
        ctx.fillStyle = '#2d5e2d'; // Grass
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.fillText("Explore World...", 350, 300);
        requestAnimationFrame(drawWorld);
    }
    drawWorld();

    // --- MATRIX EFFECT LOGIC ---
    const mCanvas = document.getElementById('matrix-canvas');
    const mCtx = mCanvas.getContext('2d');
    mCanvas.width = 800;
    mCanvas.height = 600;

    const characters = 'ｱｧｶｻﾀﾅﾊﾏﾔｬﾗﾜABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const fontSize = 16;
    const columns = mCanvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    let matrixInterval = null;

    function drawMatrix() {
        mCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
        
        mCtx.fillStyle = '#0F0';
        mCtx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            const text = characters.charAt(Math.floor(Math.random() * characters.length));
            mCtx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > mCanvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    // --- TRIGGER FUNCTION ---
    function startBattle() {
        const transitionDiv = document.getElementById('battle-transition');
        transitionDiv.style.display = 'block';
        
        // Reset drops
        drops.fill(0);
        
        // Start animation
        if(matrixInterval) clearInterval(matrixInterval);
        matrixInterval = setInterval(drawMatrix, 35);

        // End transition after 3 seconds
        setTimeout(() => {
            clearInterval(matrixInterval);
            transitionDiv.style.display = 'none';
            console.log("Battle Started!");
        }, 3000);
    }

    // Event listener for testing
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'b') startBattle();
    });

</script>
</body>
</html>

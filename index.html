<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS RPG - Ultimate Build</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { position: absolute; }
        #gameCanvas { image-rendering: pixelated; z-index: 1; }
        #uiCanvas { z-index: 2; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <canvas id="uiCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiCanvas = document.getElementById('uiCanvas');
        const uiCtx = uiCanvas.getContext('2d');

        // --- CONFIG ---
        const ASPECT_RATIO = 16 / 9;
        const scale = 3.5; 
        const tileSize = 16;
        const keys = {};

        // --- LEVEL DATA ---
        const levels = {
            town: {
                map: [
                   ,
                   ,
                   ,
                   , // Row 3: Blue door at x:4
                   ,
                   ,
                ],
                npc: { gridX: 7, gridY: 4, color: '#3498db', message: "Welcome traveler. The door leads to the old house." },
                warps: [{ x: 4, y: 3, targetLevel: 'house', targetX: 4, targetY: 4 }]
            },
            house: {
                map: [
                   ,
                   ,
                   ,
                   ,
                   , // Warp out at 4,5
                   ,
                ],
                npc: { gridX: 2, gridY: 2, color: '#9b59b6', message: "It's peaceful inside." },
                warps: [{ x: 4, y: 5, targetLevel: 'town', targetX: 4, targetY: 4 }]
            }
        };

        // --- STATE ---
        let currentKey = 'town';
        let level = levels[currentKey];
        let fade = 0, isTransitioning = false, transitionData = null;
        let timeOfDay = 0, shake = 0, particles = [];

        const player = { gridX: 2, gridY: 4, realX: 32, realY: 64, speed: 0.15, walkTimer: 0, color: '#e74c3c' };

        function initParticles() {
            particles = Array.from({length: 40}, () => ({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                s: 0.2 + Math.random() * 0.5,
                o: Math.random() * Math.PI * 2
            }));
        }

        function resize() {
            let w = window.innerWidth, h = window.innerHeight;
            if (w/h > ASPECT_RATIO) w = h * ASPECT_RATIO; else h = w / ASPECT_RATIO;
            canvas.width = w/scale; canvas.height = h/scale;
            uiCanvas.width = w; uiCanvas.height = h;
            ctx.imageSmoothingEnabled = false;
            [canvas, uiCanvas].forEach(c => { c.style.width = `${w}px`; c.style.height = `${h}px`; });
            initParticles();
        }

        window.addEventListener('resize', resize);
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'e' && !isTransitioning) {
                const dist = Math.abs(player.gridX - level.npc.gridX) + Math.abs(player.gridY - level.npc.gridY);
                if (dist === 1) { showDialogue = !showDialogue; if(showDialogue) shake = 4; }
            }
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        let showDialogue = false;

        function update() {
            timeOfDay += 0.005;
            if (shake > 0.1) shake *= 0.9; else shake = 0;

            if (isTransitioning) {
                fade += 0.05;
                if (fade >= 1) {
                    currentKey = transitionData.targetLevel;
                    level = levels[currentKey];
                    player.gridX = transitionData.targetX; player.gridY = transitionData.targetY;
                    player.realX = player.gridX * tileSize; player.realY = player.gridY * tileSize;
                    isTransitioning = false;
                }
                return;
            } else if (fade > 0) fade -= 0.05;

            particles.forEach(p => {
                p.y -= p.s; p.x += Math.sin(p.o + timeOfDay) * 0.2;
                if (p.y < -20) p.y = uiCanvas.height + 20;
            });

            const atTarget = Math.abs(player.realX - player.gridX*16) < 0.1 && Math.abs(player.realY - player.gridY*16) < 0.1;
            if (atTarget && !showDialogue) {
                let nX = player.gridX, nY = player.gridY;
                if (keys['w']) nY--; else if (keys['s']) nY++; else if (keys['a']) nX--; else if (keys['d']) nX++;
                if (level.map[nY] && level.map[nY][nX] === 0 && !(nX === level.npc.gridX && nY === level.npc.gridY)) {
                    player.gridX = nX; player.gridY = nY;
                    const warp = level.warps.find(w => w.x === nX && w.y === nY);
                    if (warp) { isTransitioning = true; transitionData = warp; showDialogue = false; }
                }
                player.walkTimer = 0;
            } else if (!atTarget) player.walkTimer += 0.25;

            player.realX += (player.gridX * 16 - player.realX) * player.speed;
            player.realY += (player.gridY * 16 - player.realY) * player.speed;
        }

        function draw() {
            update();
            const mapW = level.map.length * 16, mapH = level.map.length * 16;
            let cX = Math.max(0, Math.min(player.realX - canvas.width/2 + 8, mapW - canvas.width));
            let cY = Math.max(0, Math.min(player.realY - canvas.height/2 + 8, mapH - canvas.height));
            if (shake > 0) { cX += (Math.random()-0.5)*shake; cY += (Math.random()-0.5)*shake; }
            const rX = Math.round(cX), rY = Math.round(cY);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);

            for (let y = 0; y < level.map.length; y++) {
                for (let x = 0; x < level.map[y].length; x++) {
                    // Wall colors: Blue door at x=4 y=3, otherwise dark blue
                    ctx.fillStyle = level.map[y][x] === 1 ? (x===4 && y===3 ? '#1e3799' : '#1a252f') : '#27ae60';
                    ctx.fillRect(Math.round(x*16 - rX), Math.round(y*16 - rY), 16, 16);
                }
            }

            const nBreath = Math.sin(Date.now()/500) * 0.5;
            const pBob = Math.abs(Math.sin(player.walkTimer)) * 3;
            const render = [{...player, y: player.realY - pBob}, {...level.npc, y: level.npc.gridY*16 - nBreath, type: 'npc'}].sort((a,b)=>a.y-b.y);
            
            render.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.fillRect(Math.round((e.gridX || 0)*16 - rX), Math.round(e.y - rY), 16, 16);
                if (e.type === 'player') ctx.fillRect(Math.round(player.realX - rX), Math.round(e.y - rY), 16, 16);
            });

            const night = (Math.sin(timeOfDay) + 1) / 2;
            uiCtx.fillStyle = `rgba(10, 10, 40, ${night * 0.5})`;
            uiCtx.fillRect(0, 0, uiCanvas.width, uiCanvas.height);
            particles.forEach(p => {
                uiCtx.fillStyle = `rgba(255, ${220 + (1-night)*35}, ${180 + (1-night)*75}, 0.5)`;
                uiCtx.beginPath(); uiCtx.arc(p.x, p.y, 1.8, 0, 7); uiCtx.fill();
            });

            if (showDialogue) {
                uiCtx.fillStyle = 'rgba(15, 20, 30, 0.95)';
                uiCtx.fillRect(60, uiCanvas.height - 180, uiCanvas.width - 120, 120);
                uiCtx.fillStyle = '#eee'; uiCtx.font = 'italic 24px serif';
                uiCtx.fillText(level.npc.message, 100, uiCanvas.height - 110);
            }
            if (fade > 0) { uiCtx.fillStyle = `rgba(0,0,0,${fade})`; uiCtx.fillRect(0, 0, uiCanvas.width, uiCanvas.height); }
            requestAnimationFrame(draw);
        }
        resize(); draw();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D-HD RPG | Procedural Space Menu</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root { --glow: #fff; --bg: #020205; }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
        
        #game-wrapper { position: relative; width: 800px; height: 600px; border: 2px solid #333; overflow: hidden; background: #000; box-shadow: 0 0 100px #000; }
        canvas { position: absolute; top: 0; left: 0; }

        #crt-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 100; 
        }

        .ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; color: white; transition: opacity 0.8s ease;}
        
        .menu-btn { 
            background: none; border: none; color: rgba(255,255,255,0.6); font-size: 22px; padding: 12px; cursor: pointer; 
            font-family: 'IBM Plex Mono', monospace; transition: 0.4s; letter-spacing: 3px; font-style: italic;
        }
        .menu-btn:hover { color: #fff; text-shadow: 0 0 15px #fff; transform: translateX(10px); }
        .menu-btn.active { color: #fff; text-shadow: 0 0 20px #fff; }

        #main-title {
            font-family: 'Cinzel Decorative', serif; font-size: 52px; letter-spacing: 12px; margin-top: 20px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5), 0 2px 4px #000;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="crt-overlay"></div>
    <canvas id="mainCanvas"></canvas>

    <div id="menu-layer" class="ui-layer">
        <h1 id="main-title">PROJECT ALPHA</h1>
        <div id="menu-options" style="margin-top: 40px;">
            <button class="menu-btn" data-action="new-game">START JOURNEY</button>
            <button class="menu-btn" data-action="settings">OPTIONS</button>
            <button class="menu-btn" data-action="exit">EXIT</button>
        </div>
    </div>
</div>

<script>
/**
 * THE CORE ENGINE
 */
const Engine = {
    canvas: document.getElementById('mainCanvas'),
    ctx: document.getElementById('mainCanvas').getContext('2d'),
    width: 800, height: 600, state: 'MENU', frame: 0,
    
    init() {
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        MenuSystem.init();
        this.loop();
    },
    
    loop() {
        this.frame++;
        this.ctx.clearRect(0, 0, this.width, this.height);
        
        // Modular Rendering
        if(this.state === 'MENU') {
            MenuSystem.drawBackground(this.ctx);
            MenuSystem.drawCrest(this.ctx);
        }
        
        requestAnimationFrame(() => this.loop());
    }
};

/**
 * MENU SYSTEM MODULE
 */
const MenuSystem = {
    stars: [],
    nebulas: [],

    init() {
        // Build Procedural Space
        for(let i=0; i<150; i++) {
            this.stars.push({
                x: Math.random() * 800,
                y: Math.random() * 600,
                size: Math.random() * 2,
                blink: Math.random() * 5,
                v: Math.random() * 0.2 + 0.05
            });
        }
        this.nebulas = [
            { x: 200, y: 200, color: 'rgba(50, 0, 150, 0.1)', r: 300 },
            { x: 600, y: 400, color: 'rgba(150, 0, 50, 0.1)', r: 350 }
        ];
    },

    drawBackground(ctx) {
        // Deep Space Gradient
        ctx.fillStyle = "#020208";
        ctx.fillRect(0,0,800,600);

        // Draw Nebulas (Gradients)
        this.nebulas.forEach(n => {
            const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
            g.addColorStop(0, n.color);
            g.addColorStop(1, 'transparent');
            ctx.fillStyle = g;
            ctx.fillRect(0,0,800,600);
        });

        // Twinkling Embers
        ctx.fillStyle = "#fff";
        this.stars.forEach(s => {
            s.y -= s.v; if(s.y < 0) s.y = 600;
            const alpha = 0.3 + Math.abs(Math.sin(s.blink + Engine.frame * 0.02)) * 0.7;
            ctx.globalAlpha = alpha;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        });
        ctx.globalAlpha = 1.0;
    },

    drawCrest(ctx) {
        ctx.save();
        ctx.translate(400, 260); // Center of the crest
        
        // Shield Glow
        ctx.shadowBlur = 40;
        ctx.shadowColor = "rgba(255,255,255,0.2)";
        
        // Simple 16-bit Shield Outline
        ctx.strokeStyle = "rgba(255,255,255,0.3)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -80);
        ctx.lineTo(60, -60);
        ctx.lineTo(60, 20);
        ctx.lineTo(0, 80);
        ctx.lineTo(-60, 20);
        ctx.lineTo(-60, -60);
        ctx.closePath();
        ctx.stroke();

        // The Sword (Octopath Italic Slash)
        ctx.rotate(-Math.PI / 6);
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.fillRect(-2, -100, 4, 200); // Blade
        ctx.fillRect(-15, 60, 30, 4);   // Guard
        
        ctx.restore();
    }
};

// UI Handling
document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.addEventListener('mouseenter', () => btn.classList.add('active'));
    btn.addEventListener('mouseleave', () => btn.classList.remove('active'));
});

// Fire the Engine
Engine.init();
</script>
</body>
</html>

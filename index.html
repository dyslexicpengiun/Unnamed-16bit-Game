<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS RPG - Pixel Rain Drip</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { position: absolute; }
        #gameCanvas { image-rendering: pixelated; z-index: 1; }
        #uiCanvas { z-index: 2; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <canvas id="uiCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiCanvas = document.getElementById('uiCanvas');
        const uiCtx = uiCanvas.getContext('2d');

        const ASPECT_RATIO = 16 / 9;
        const scale = 3.5; 
        const tileSize = 16;
        const keys = {};

        // --- LEVELS ---
        const levels = {
            town: {
                map: [
                  ,
                  ,
                  ,
                  ,
                  ,
                ],
                npc: { x: 7, y: 2, color: '#3498db', msg: "Press 'B' for the Pixel Drip transition!" },
                warps: [{ x: 4, y: 4, to: 'house', tx: 4, ty: 4 }],
                chests: []
            },
            house: {
                map: [
                  ,
                  ,
                  ,
                  ,
                  ,
                ],
                npc: { x: 2, y: 1, color: '#9b59b6', msg: "Cozy." },
                warps: [{ x: 4, y: 5, to: 'town', tx: 4, ty: 5 }],
                chests: [{ x: 6, y: 2, opened: false, item: "Rusty Sword", color: "#d35400" }]
            }
        };

        // --- STATE ---
        let gameState = 'EXPLORE'; 
        let currentKey = 'town';
        let level = levels[currentKey];
        let fade = 0, isWarping = false, warpData = null;
        let time = 0, shake = 0, parts = [];
        let dialogue = false, diagMsg = "";
        let isAutoTime = true, manualNight = 0;

        // --- PIXEL DRIP SYSTEM ---
        let dripColumns = [];
        const DRIP_WIDTH = 12; // Width of each "rain" column

        function initDrip() {
            dripColumns = [];
            const cols = Math.ceil(uiCanvas.width / DRIP_WIDTH);
            for (let i = 0; i < cols; i++) {
                dripColumns.push({
                    x: i * DRIP_WIDTH,
                    y: -Math.random() * 200, // Staggered start heights
                    speed: 5 + Math.random() * 8
                });
            }
        }

        function resize() {
            let w = window.innerWidth, h = window.innerHeight;
            if (w/h > ASPECT_RATIO) w = h * ASPECT_RATIO; else h = w / ASPECT_RATIO;
            canvas.width = w/scale; canvas.height = h/scale;
            uiCanvas.width = w; uiCanvas.height = h;
            ctx.imageSmoothingEnabled = false;
            [canvas, uiCanvas].forEach(c => { c.style.width = `${w}px`; c.style.height = `${h}px`; });
            parts = Array.from({length: 30}, () => ({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, v: 0.2 + Math.random() * 0.5 }));
        }

        window.addEventListener('resize', resize);
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            keys[k] = true;
            if (k === 'n') { isAutoTime = !isAutoTime; if(!isAutoTime) manualNight = (Math.sin(time) > 0) ? 0 : 1; }
            if (k === 'b' && gameState === 'EXPLORE') {
                gameState = 'TRANSITION';
                initDrip();
                dialogue = false;
            }
            if (k === 'e' && !isWarping && gameState === 'EXPLORE') {
                if (dialogue) { dialogue = false; return; }
                const dNPC = Math.abs(player.gx - level.npc.x) + Math.abs(player.gy - level.npc.y);
                if (dNPC === 1) { diagMsg = level.npc.msg; dialogue = true; shake = 3; return; }
                level.chests.forEach(c => {
                    if (Math.abs(player.gx - c.x) + Math.abs(player.gy - c.y) === 1 && !c.opened) {
                        c.opened = true; c.color = "#7f8c8d"; diagMsg = "Found: " + c.item + "!"; dialogue = true; shake = 8;
                    }
                });
            }
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const player = { gx: 2, gy: 2, rx: 32, ry: 32, s: 0.18, anim: 0, color: '#e74c3c' };

        function update() {
            if (gameState === 'TRANSITION') {
                let finished = true;
                dripColumns.forEach(c => {
                    c.y += c.speed;
                    if (c.y < uiCanvas.height) finished = false;
                });
                if (finished) gameState = 'BATTLE';
                return;
            }

            if (gameState === 'BATTLE') return;

            if (isAutoTime) time += 0.005;
            else time += ((manualNight === 1 ? Math.PI/2 : -Math.PI/2) - time) * 0.05;
            if (shake > 0.1) shake *= 0.8; else shake = 0;
            parts.forEach(p => { p.y -= p.v; if (p.y < -10) p.y = uiCanvas.height + 10; });

            if (isWarping) {
                fade += 0.08; 
                if (fade >= 1) {
                    currentKey = warpData.to; level = levels[currentKey];
                    player.gx = warpData.tx; player.gy = warpData.ty;
                    player.rx = player.gx * 16; player.ry = player.gy * 16;
                    isWarping = false; dialogue = false;
                }
                return;
            } else if (fade > 0) fade -= 0.08;

            const atTarget = Math.abs(player.rx - player.gx*16) < 0.5 && Math.abs(player.ry - player.gy*16) < 0.5;
            if (atTarget) {
                const w = level.warps.find(wp => wp.x === player.gx && wp.y === player.gy);
                if (w) { isWarping = true; warpData = w; return; }
                if (!dialogue) {
                    let nx = player.gx, ny = player.gy;
                    if (keys['w']) ny--; else if (keys['s']) ny++; else if (keys['a']) nx--; else if (keys['d']) nx++;
                    if (level.map[ny] && level.map[ny][nx] !== 1 && !(nx === level.npc.x && ny === level.npc.y)) {
                        if (!level.chests.some(c => c.x === nx && c.y === ny)) {
                            player.gx = nx; player.gy = ny;
                        }
                    }
                }
            }
            player.rx += (player.gx * 16 - player.rx) * player.s;
            player.ry += (player.gy * 16 - player.ry) * player.s;
        }

        function draw() {
            update();
            
            // We ALWAYS draw the "Current Environment" to the main canvas
            const mW = level.map.length * 16, mH = level.map.length * 16;
            let cx = Math.max(0, Math.min(player.rx - canvas.width/2 + 8, mW - canvas.width));
            let cy = Math.max(0, Math.min(player.ry - canvas.height/2 + 8, mH - canvas.height));
            if (shake > 0) { cx += (Math.random()-0.5)*shake; cy += (Math.random()-0.5)*shake; }
            const rx = Math.round(cx), ry = Math.round(cy);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);

            if (gameState !== 'BATTLE') {
                level.map.forEach((row, y) => row.forEach((tile, x) => {
                    const isDoor = level.warps.some(w => w.x === x && w.y === y);
                    ctx.fillStyle = tile === 1 ? '#1a252f' : (isDoor ? '#3498db' : '#27ae60');
                    ctx.fillRect(Math.round(x*16 - rx), Math.round(y*16 - ry), 16, 16);
                }));

                const pY = player.ry - Math.abs(Math.sin(Date.now()/200)) * 2;
                const ents = [{x:player.rx, y:pY, c:player.color}, {x:level.npc.x*16, y:level.npc.y*16, c:level.npc.color}];
                level.chests.forEach(c => ents.push({x: c.x*16, y: c.y*16, c: c.color}));
                ents.forEach(e => { ctx.fillStyle = e.c; ctx.fillRect(Math.round(e.x-rx), Math.round(e.y-ry), 16, 16); });

                const night = (Math.sin(time) + 1) / 2;
                uiCtx.fillStyle = `rgba(10, 10, 40, ${night * 0.4})`;
                uiCtx.fillRect(0, 0, uiCanvas.width, uiCanvas.height);
                parts.forEach(p => { uiCtx.fillStyle = `rgba(255, 200, 150, 0.6)`; uiCtx.beginPath(); uiCtx.arc(p.x, p.y, 2, 0, 7); uiCtx.fill(); });
            } else {
                // Persistent Battle Scene
                ctx.fillStyle = '#002'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                uiCtx.fillStyle = 'white'; 
                uiCtx.font = '30px serif';
                uiCtx.fillText("BATTLE ARENA", 100, 100);
            }

            // --- THE PIXEL DRIP REVEAL ---
            if (gameState === 'TRANSITION') {
                // Draw the NEW environment (blue battle arena) over the old one using drip columns
                dripColumns.forEach(col => {
                    uiCtx.fillStyle = '#002'; // The color of the upcoming battle arena
                    // Draw a rectangle from the top of the screen down to the drip's current Y
                    uiCtx.fillRect(col.x, 0, DRIP_WIDTH, col.y);
                    
                    // Optional: Draw a "leading edge" light strip for that digital feel
                    uiCtx.fillStyle = '#4834d4';
                    uiCtx.fillRect(col.x, col.y - 4, DRIP_WIDTH, 4);
                });
            }

            if (dialogue && gameState === 'EXPLORE') {
                uiCtx.fillStyle = 'rgba(15,20,30,0.9)'; uiCtx.fillRect(60, uiCanvas.height-160, uiCanvas.width-120, 100);
                uiCtx.fillStyle='#eee'; uiCtx.font='italic 22px serif'; uiCtx.fillText(diagMsg, 100, uiCanvas.height-100);
            }

            if (fade > 0) { uiCtx.fillStyle = `rgba(0,0,0,${fade})`; uiCtx.fillRect(0,0,uiCanvas.width,uiCanvas.height); }
            requestAnimationFrame(draw);
        }
        resize(); draw();
    </script>
</body>
</html>

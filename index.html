<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D-HD RPG | Project Alpha</title>
    <style>
        :root { --glow: #fff; --bg: #050505; }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
        
        #game-wrapper { position: relative; width: 800px; height: 600px; border: 2px solid #222; overflow: hidden; box-shadow: 0 0 50px #000; }
        canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }

        /* CRT Scanline Overlay */
        #crt-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 100; 
        }

        /* Modular UI Layers */
        .ui-layer { 
            position: absolute; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 50; color: white; transition: opacity 0.6s ease;
        }
        .hidden { opacity: 0; pointer-events: none; }

        /* Menu Styling */
        .menu-btn { 
            background: none; border: none; color: rgba(255,255,255,0.5); 
            font-size: 24px; padding: 10px; cursor: pointer; font-family: inherit;
            transition: 0.3s; letter-spacing: 3px;
        }
        .menu-btn:hover { color: #fff; text-shadow: 0 0 10px #fff; transform: scale(1.1); }
        .menu-btn.active { color: #fff; text-shadow: 0 0 15px #fff; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="crt-overlay"></div>
    <canvas id="mainCanvas"></canvas>

    <!-- MAIN MENU LAYER -->
    <div id="menu-layer" class="ui-layer">
        <h1 style="font-size: 50px; letter-spacing: 15px; margin-bottom: 60px; text-shadow: 0 0 20px rgba(255,255,255,0.5);">PROJECT ALPHA</h1>
        <div id="menu-options" style="display:flex; flex-direction:column; gap: 15px;">
            <button class="menu-btn active" data-action="new-game">START JOURNEY</button>
            <button class="menu-btn" data-action="settings">OPTIONS</button>
            <button class="menu-btn" data-action="exit">EXIT</button>
        </div>
    </div>
</div>

<script>
/**
 * CORE ENGINE MODULE
 */
const Engine = {
    canvas: document.getElementById('mainCanvas'),
    ctx: document.getElementById('mainCanvas').getContext('2d'),
    width: 800,
    height: 600,
    state: 'MENU', // MENU, CHAR_SELECT, WORLD, BATTLE
    frame: 0,

    init() {
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        this.loop();
    },

    loop() {
        this.frame++;
        this.ctx.clearRect(0, 0, this.width, this.height);

        switch(this.state) {
            case 'MENU': MenuSystem.draw(this.ctx); break;
            case 'CHAR_SELECT': GallerySystem.draw(this.ctx); break;
        }

        requestAnimationFrame(() => this.loop());
    }
};

/**
 * MENU SYSTEM MODULE
 */
const MenuSystem = {
    particles: Array.from({length: 30}, () => ({
        x: Math.random() * 800,
        y: Math.random() * 600,
        s: Math.random() * 2 + 1,
        v: Math.random() * 0.5 + 0.2
    })),

    draw(ctx) {
        // Background - Dark subtle gradient
        const grad = ctx.createRadialGradient(400, 300, 0, 400, 300, 500);
        grad.addColorStop(0, '#0a0a0a');
        grad.addColorStop(1, '#000');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 800, 600);

        // Floating "Dust" Particles
        ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
        this.particles.forEach(p => {
            p.y -= p.v;
            if (p.y < 0) p.y = 600;
            ctx.fillRect(p.x, p.y, p.s, p.s);
        });
    },

    handleInput(action) {
        if (action === 'new-game') {
            document.getElementById('menu-layer').classList.add('hidden');
            Engine.state = 'CHAR_SELECT';
            // We will build GallerySystem next!
        }
    }
};

/**
 * INPUT LISTENERS
 */
document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        MenuSystem.handleInput(e.target.dataset.action);
    });
});

// Boot the engine
Engine.init();

</script>
</body>
</html>

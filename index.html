<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-bit 2D-HD: Fixed Shake</title>
    <style>
        body { margin: 0; background: #020202; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* The wrapper that actually shakes - No CSS transitions here! */
        #shake-wrapper { position: relative; width: 800px; height: 600px; }
        
        #game-container { 
            position: relative; width: 100%; height: 100%; border: 2px solid #333; 
            overflow: hidden; background: #000; box-shadow: 0 0 80px rgba(0,0,0,1); 
        }
        canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

<div id="shake-wrapper">
    <div id="game-container">
        <div id="flash"></div>
        <canvas id="battleCanvas"></canvas>
        <canvas id="worldCanvas"></canvas>
    </div>
</div>

<script>
    const worldCanvas = document.getElementById('worldCanvas');
    const worldCtx = worldCanvas.getContext('2d');
    const battleCanvas = document.getElementById('battleCanvas');
    const battleCtx = battleCanvas.getContext('2d');
    const flashEl = document.getElementById('flash');
    const shakeWrapper = document.getElementById('shake-wrapper');

    const WIDTH = 800; const HEIGHT = 600;
    worldCanvas.width = battleCanvas.width = WIDTH;
    worldCanvas.height = battleCanvas.height = HEIGHT;

    let frame = 0;
    let transitionActive = false;
    let shakePower = 0; 

    const townNPCs = [{ x: 220, y: 440, color: '#ffccaa' }, { x: 520, y: 410, color: '#aaccff' }];
    const particles = Array.from({ length: 40 }, () => ({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, v: Math.random() * 1.5 + 0.5 }));

    function drawScene(ctx, type) {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = type === 'town' ? '#3e8948' : '#121212';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        
        const chars = type === 'town' ? townNPCs : [{ x: 380, y: 270, color: '#ff3333' }];
        chars.forEach(c => {
            const bob = Math.sin(frame * 0.15) * 6;
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(c.x + 20, c.y + 45, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = c.color;
            ctx.fillRect(c.x, c.y + bob, 40, 45);
        });

        // Embers
        ctx.fillStyle = type === 'town' ? 'rgba(255,255,255,0.3)' : 'rgba(255,100,50,0.6)';
        particles.forEach(p => { p.y -= p.v; if (p.y < 0) p.y = HEIGHT; ctx.fillRect(p.x, p.y, 2, 2); });

        // UI
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(40, 20, 720, 60);
        ctx.strokeStyle = type === 'town' ? '#fff' : '#ff4400';
        ctx.strokeRect(45, 25, 710, 50);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(type === 'town' ? "> PEACEFUL TOWN [B] TO BATTLE" : "> COMBAT MODE ACTIVE", 70, 55);
    }

    function mainLoop() {
        frame++;
        drawScene(battleCtx, 'battle'); 

        // --- FIXED SHAKE LOGIC ---
        if (shakePower > 0.1) {
            const x = (Math.random() - 0.5) * shakePower;
            const y = (Math.random() - 0.5) * shakePower;
            shakeWrapper.style.transform = `translate(${x}px, ${y}px)`;
            shakePower *= 0.90; // Decay the shake power
        } else {
            shakeWrapper.style.transform = `translate(0,0)`;
        }

        if (!transitionActive) {
            drawScene(worldCtx, 'town'); 
        } else {
            const stripWidth = 4;
            const columns = Math.ceil(WIDTH / stripWidth) + 60;
            for (let i = 0; i < columns; i++) {
                if (drops[i] < HEIGHT) {
                    const xCurrent = ((i * stripWidth) - 150) + (drops[i] / 2.5);
                    
                    // Chromatic Drip
                    worldCtx.globalCompositeOperation = 'screen';
                    worldCtx.globalAlpha = 0.4;
                    worldCtx.drawImage(battleCanvas, xCurrent + 3, drops[i], stripWidth, 12, xCurrent + 3, drops[i], stripWidth, 12);
                    worldCtx.drawImage(battleCanvas, xCurrent - 3, drops[i], stripWidth, 12, xCurrent - 3, drops[i], stripWidth, 12);
                    
                    worldCtx.globalCompositeOperation = 'source-over';
                    worldCtx.globalAlpha = 1.0;
                    worldCtx.drawImage(battleCanvas, xCurrent, drops[i], stripWidth, 12, xCurrent, drops[i], stripWidth, 12);
                    
                    drops[i] += speeds[i];
                }
            }
        }
        requestAnimationFrame(mainLoop);
    }

    const drops = new Array(Math.ceil(WIDTH / 4) + 60).fill(0);
    let speeds = [];

    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'b' && !transitionActive) {
            // Flash
            flashEl.style.transition = "none";
            flashEl.style.opacity = "1";
            setTimeout(() => { flashEl.style.transition = "opacity 0.8s ease-out"; flashEl.style.opacity = "0"; }, 50);
            
            // Trigger Shake
            shakePower = 18; 
            
            drops.fill(0);
            speeds = Array.from({ length: drops.length }, () => Math.random() * 10 + 7);
            transitionActive = true;
        }
    });

    mainLoop();
</script>
</body>
</html>

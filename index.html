<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-bit 2D-HD: UI Drip Edition</title>
    <style>
        body { margin: 0; background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 600px; border: 2px solid #222; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="flash"></div>
    <canvas id="battleCanvas"></canvas>
    <canvas id="worldCanvas"></canvas>
</div>

<script>
    const worldCanvas = document.getElementById('worldCanvas');
    const worldCtx = worldCanvas.getContext('2d');
    const battleCanvas = document.getElementById('battleCanvas');
    const battleCtx = battleCanvas.getContext('2d');
    const flashEl = document.getElementById('flash');

    const WIDTH = 800; const HEIGHT = 600;
    worldCanvas.width = battleCanvas.width = WIDTH;
    worldCanvas.height = battleCanvas.height = HEIGHT;

    let frame = 0;
    let transitionActive = false;
    const stripWidth = 4; // Smaller strips for smoother angled look
    const columns = Math.ceil(WIDTH / stripWidth) + 40; // Extra columns for angled offset
    let drops = new Array(columns).fill(0);
    let speeds = new Array(columns).fill(0);
    let windAngle = 2; // Horizontal shift per vertical step

    const townNPCs = [{ x: 200, y: 450, color: '#ffccaa' }, { x: 550, y: 420, color: '#aaccff' }];
    const particles = Array.from({ length: 40 }, () => ({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, v: Math.random() * 0.5 + 0.2 }));

    function drawScene(ctx, type) {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = type === 'town' ? '#3e8948' : '#1a120c';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        
        const chars = type === 'town' ? townNPCs : [{ x: 380, y: 280, color: '#ff4444' }];
        chars.forEach(c => {
            const bob = Math.sin(frame * 0.15) * 4;
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(c.x + 20, c.y + 45, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = c.color;
            ctx.fillRect(c.x, c.y + bob, 40, 45);
        });

        // Pixel Embers
        ctx.fillStyle = type === 'town' ? 'rgba(255,255,255,0.3)' : 'rgba(255,100,0,0.5)';
        particles.forEach(p => { p.y -= p.v; if (p.y < 0) p.y = HEIGHT; ctx.fillRect(p.x, p.y, 2, 2); });

        // --- DRAW UI DIRECTLY ON CANVAS ---
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(50, 20, 700, 60);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(55, 25, 690, 50);
        ctx.fillStyle = '#fff';
        ctx.font = '20px monospace';
        const msg = type === 'town' ? "VILLAGE: PRESS 'B' TO FIGHT!" : "DANGER: BOSS ENCOUNTER!";
        ctx.fillText(msg, 100, 55);
    }

    function mainLoop() {
        frame++;
        drawScene(battleCtx, 'battle'); 

        if (!transitionActive) {
            drawScene(worldCtx, 'town'); 
        } else {
            for (let i = 0; i < columns; i++) {
                if (drops[i] < HEIGHT) {
                    const xOrigin = (i * stripWidth) - 100; // Start offset for wind
                    const currentY = drops[i];
                    const xCurrent = xOrigin + (currentY / windAngle); // Calculate angled X
                    
                    worldCtx.drawImage(
                        battleCanvas, 
                        xCurrent, currentY, stripWidth, speeds[i] + 4, 
                        xCurrent, currentY, stripWidth, speeds[i] + 4
                    );
                    drops[i] += speeds[i];
                }
            }
        }
        requestAnimationFrame(mainLoop);
    }

    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'b' && !transitionActive) {
            flashEl.style.transition = "none";
            flashEl.style.opacity = "1";
            setTimeout(() => { flashEl.style.transition = "opacity 0.6s"; flashEl.style.opacity = "0"; }, 50);
            
            drops.fill(0);
            speeds = Array.from({ length: columns }, () => Math.random() * 7 + 5);
            transitionActive = true;
        }
    });

    mainLoop();
</script>
</body>
</html>

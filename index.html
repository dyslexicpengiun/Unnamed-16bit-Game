<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-bit RPG | 2D-HD Journey</title>
    <style>
        body { margin: 0; background: #010101; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
        #shake-wrapper { position: relative; width: 800px; height: 600px; }
        #game-container { position: relative; width: 100%; height: 100%; border: 2px solid #333; overflow: hidden; background: #000; box-shadow: 0 0 100px rgba(0,0,0,1); }
        canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
        
        /* OVERLAY UI */
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; transition: opacity 0.5s ease; color: white; background: rgba(0,0,0,0.8); }
        .hidden { opacity: 0; pointer-events: none; }
        
        /* MENU BUTTONS */
        .btn { background: none; border: 2px solid white; color: white; padding: 15px 40px; font-size: 20px; cursor: pointer; margin: 10px; transition: 0.2s; font-family: inherit; }
        .btn:hover { background: white; color: black; box-shadow: 0 0 20px #fff; }

        /* CHARACTER PICKER GRID */
        .char-grid { display: flex; gap: 20px; margin-top: 30px; }
        .char-card { border: 2px solid #444; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; width: 120px; }
        .char-card:hover { border-color: #fff; transform: translateY(-10px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
        .char-card.selected { border-color: #0f0; box-shadow: 0 0 20px #0f0; }

        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

<div id="shake-wrapper">
    <div id="game-container">
        <div id="flash"></div>
        
        <!-- START SCREEN -->
        <div id="start-screen" class="ui-overlay">
            <h1 style="font-size: 60px; text-shadow: 4px 4px #444; margin-bottom: 50px;">UNNAMED RPG</h1>
            <button class="btn" onclick="showCharacterSelect()">NEW GAME</button>
            <button class="btn">SETTINGS</button>
            <button class="btn">EXIT</button>
        </div>

        <!-- CHARACTER SELECT -->
        <div id="char-select" class="ui-overlay hidden">
            <h2>CHOOSE YOUR HERO</h2>
            <div class="char-grid">
                <div class="char-card" onclick="selectChar(0)">
                    <div style="height:50px; background:#ffccaa; margin-bottom:10px;"></div>
                    <span>WARRIOR</span>
                </div>
                <div class="char-card" onclick="selectChar(1)">
                    <div style="height:50px; background:#aaccff; margin-bottom:10px;"></div>
                    <span>MAGE</span>
                </div>
                <div class="char-card" onclick="selectChar(2)">
                    <div style="height:50px; background:#ccffaa; margin-bottom:10px;"></div>
                    <span>ROGUE</span>
                </div>
            </div>
            <button class="btn" style="margin-top:50px;" onclick="startGame()">EMBARK</button>
        </div>

        <canvas id="battleCanvas"></canvas>
        <canvas id="worldCanvas"></canvas>
    </div>
</div>

<script>
    const worldCanvas = document.getElementById('worldCanvas');
    const worldCtx = worldCanvas.getContext('2d');
    const battleCanvas = document.getElementById('battleCanvas');
    const battleCtx = battleCanvas.getContext('2d');
    const flashEl = document.getElementById('flash');
    const shakeWrapper = document.getElementById('shake-wrapper');

    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const charSelect = document.getElementById('char-select');

    const WIDTH = 800; const HEIGHT = 600;
    worldCanvas.width = battleCanvas.width = WIDTH;
    worldCanvas.height = battleCanvas.height = HEIGHT;

    let gameState = "MENU"; // MENU, CHAR_SELECT, PLAYING, BATTLE
    let frame = 0;
    let inBattle = false;
    let transitionActive = false;
    let shakePower = 0;
    let playerColor = "#fff";

    // ENTITIES
    const townNPCs = [{ x: 220, y: 440, h: 45, s: 80, l: 70 }, { x: 520, y: 410, h: 200, s: 70, l: 60 }];
    const bossEntity = { x: 380, y: 270, h: 0, s: 90, l: 50 };
    const particles = Array.from({ length: 50 }, () => ({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, v: Math.random() * 1.8 + 0.4 }));

    // --- UI NAVIGATION ---
    function showCharacterSelect() {
        startScreen.classList.add('hidden');
        charSelect.classList.remove('hidden');
    }

    function selectChar(index) {
        const colors = ["#ffccaa", "#aaccff", "#ccffaa"];
        playerColor = colors[index];
        const cards = document.querySelectorAll('.char-card');
        cards.forEach((c, i) => i === index ? c.classList.add('selected') : c.classList.remove('selected'));
    }

    function startGame() {
        charSelect.classList.add('hidden');
        gameState = "PLAYING";
        // Brief flash for the game start
        flashEl.style.opacity = "1";
        setTimeout(() => { flashEl.style.transition = "opacity 1s"; flashEl.style.opacity = "0"; }, 50);
    }

    function drawScene(ctx, type) {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        if(gameState === "MENU") return; // Keep canvas clear during main menu

        ctx.fillStyle = type === 'town' ? '#254a21' : '#080808';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        
        // Render Player + NPCs
        const chars = type === 'town' ? [...townNPCs, { x: 400, y: 300, isPlayer: true }] : [bossEntity];
        chars.forEach(c => {
            const bob = Math.sin(frame * 0.12) * 6;
            ctx.fillStyle = c.isPlayer ? playerColor : `hsl(${c.h}, ${c.s}%, ${c.l}%)`;
            ctx.fillRect(c.x, c.y + bob, 40, 45);
        });

        // Embers
        ctx.fillStyle = type === 'town' ? 'rgba(255,255,200,0.3)' : 'rgba(255,80,0,0.7)';
        particles.forEach(p => { p.y -= p.v; if (p.y < 0) p.y = HEIGHT; ctx.fillRect(p.x, p.y, 2, 2); });
    }

    function mainLoop() {
        frame++;
        if (gameState !== "MENU" && gameState !== "CHAR_SELECT") {
            drawScene(battleCtx, 'battle'); 
            
            if (shakePower > 0.1) {
                const x = (Math.random() - 0.5) * shakePower;
                const y = (Math.random() - 0.5) * shakePower;
                shakeWrapper.style.transform = `translate(${x}px, ${y}px)`;
                shakePower *= 0.91;
            } else { shakeWrapper.style.transform = `translate(0,0)`; }

            if (!transitionActive) {
                drawScene(worldCtx, inBattle ? 'battle' : 'town'); 
            } else {
                // ... (Existing Transition Logic) ...
                processTransition();
            }
        }
        requestAnimationFrame(mainLoop);
    }

    function processTransition() {
        const stripWidth = 4;
        const columns = Math.ceil(WIDTH / stripWidth) + 65;
        let finished = true;
        for (let i = 0; i < columns; i++) {
            if (drops[i] < HEIGHT + 100) {
                finished = false;
                const xCurrent = ((i * stripWidth) - 150) + (drops[i] / 3);
                worldCtx.globalCompositeOperation = 'screen';
                worldCtx.globalAlpha = 0.5;
                worldCtx.drawImage(battleCanvas, xCurrent + 3, drops[i], stripWidth, 15, xCurrent + 3, drops[i], stripWidth, 15);
                worldCtx.drawImage(battleCanvas, xCurrent - 3, drops[i], stripWidth, 15, xCurrent - 3, drops[i], stripWidth, 15);
                worldCtx.globalCompositeOperation = 'source-over';
                worldCtx.globalAlpha = 1.0;
                worldCtx.drawImage(battleCanvas, xCurrent, drops[i], stripWidth, 15, xCurrent, drops[i], stripWidth, 15);
                drops[i] += speeds[i];
            }
        }
        if (finished) { transitionActive = false; inBattle = true; }
    }

    const drops = new Array(Math.ceil(WIDTH / 4) + 65).fill(0);
    let speeds = [];

    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'b' && !transitionActive && gameState === "PLAYING") {
            flashEl.style.transition = "none";
            flashEl.style.opacity = "1";
            setTimeout(() => { flashEl.style.transition = "opacity 1.5s ease-out"; flashEl.style.opacity = "0"; }, 50);
            shakePower = 25; 
            drops.fill(0);
            speeds = Array.from({ length: drops.length }, () => Math.random() * 11 + 7);
            transitionActive = true;
        }
        if (key === 'r') { inBattle = false; transitionActive = false; drops.fill(0); }
    });

    mainLoop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-bit 2D-HD: Chromatic Drip</title>
    <style>
        body { margin: 0; background: #020202; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 600px; border: 2px solid #333; overflow: hidden; background: #000; box-shadow: 0 0 100px rgba(0,0,0,0.8); }
        canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="flash"></div>
    <canvas id="battleCanvas"></canvas>
    <canvas id="worldCanvas"></canvas>
</div>

<script>
    const worldCanvas = document.getElementById('worldCanvas');
    const worldCtx = worldCanvas.getContext('2d');
    const battleCanvas = document.getElementById('battleCanvas');
    const battleCtx = battleCanvas.getContext('2d');
    const flashEl = document.getElementById('flash');

    const WIDTH = 800; const HEIGHT = 600;
    worldCanvas.width = battleCanvas.width = WIDTH;
    worldCanvas.height = battleCanvas.height = HEIGHT;

    let frame = 0;
    let transitionActive = false;
    const stripWidth = 4;
    const columns = Math.ceil(WIDTH / stripWidth) + 60; 
    let drops = new Array(columns).fill(0);
    let speeds = new Array(columns).fill(0);
    const windAngle = 2.5; 

    const townNPCs = [{ x: 200, y: 450, color: '#ffccaa' }, { x: 550, y: 420, color: '#aaccff' }];
    const particles = Array.from({ length: 40 }, () => ({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, v: Math.random() * 1.2 + 0.5 }));

    function drawScene(ctx, type) {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = type === 'town' ? '#3e8948' : '#1a120c';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        
        const chars = type === 'town' ? townNPCs : [{ x: 380, y: 280, color: '#ff4444' }];
        
        chars.forEach(c => {
            // MOTION BLUR (Ghosting)
            for (let i = 3; i >= 0; i--) {
                const ghostBob = Math.sin((frame - (i * 2)) * 0.15) * 6;
                ctx.globalAlpha = i === 0 ? 1.0 : 0.25 / i;
                
                if (i === 0) {
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.beginPath(); ctx.ellipse(c.x + 20, c.y + 45, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
                }
                
                ctx.fillStyle = c.color;
                ctx.fillRect(c.x, c.y + ghostBob, 40, 45);
            }
            ctx.globalAlpha = 1.0;
        });

        // Embers
        ctx.fillStyle = type === 'town' ? 'rgba(255,255,255,0.4)' : 'rgba(255,150,50,0.7)';
        particles.forEach(p => { p.y -= p.v; if (p.y < 0) p.y = HEIGHT; ctx.fillRect(p.x, p.y, 2, 2); });

        // Drippable UI
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(50, 20, 700, 60);
        ctx.strokeStyle = type === 'town' ? '#fff' : '#ff3300';
        ctx.strokeRect(55, 25, 690, 50);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.fillText(type === 'town' ? "> OVERWORLD: PRESS 'B' TO FIGHT" : "> ENEMY SPOTTED: INITIATING BATTLE", 80, 55);
    }

    function mainLoop() {
        frame++;
        drawScene(battleCtx, 'battle'); 

        if (!transitionActive) {
            drawScene(worldCtx, 'town'); 
        } else {
            // CHROMATIC ABERRATION DRIP
            for (let i = 0; i < columns; i++) {
                if (drops[i] < HEIGHT) {
                    const xOrigin = (i * stripWidth) - 150; 
                    const currentY = drops[i];
                    const xCurrent = xOrigin + (currentY / windAngle); 
                    
                    // Layer 1: Red Shift
                    worldCtx.globalCompositeOperation = 'screen';
                    worldCtx.globalAlpha = 0.5;
                    worldCtx.drawImage(battleCanvas, xCurrent + 3, currentY, stripWidth, speeds[i] + 5, xCurrent + 3, currentY, stripWidth, speeds[i] + 5);
                    
                    // Layer 2: Blue Shift
                    worldCtx.drawImage(battleCanvas, xCurrent - 3, currentY, stripWidth, speeds[i] + 5, xCurrent - 3, currentY, stripWidth, speeds[i] + 5);
                    
                    // Layer 3: Main Image (Normal)
                    worldCtx.globalCompositeOperation = 'source-over';
                    worldCtx.globalAlpha = 1.0;
                    worldCtx.drawImage(battleCanvas, xCurrent, currentY, stripWidth, speeds[i] + 5, xCurrent, currentY, stripWidth, speeds[i] + 5);
                    
                    drops[i] += speeds[i];
                }
            }
        }
        requestAnimationFrame(mainLoop);
    }

    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'b' && !transitionActive) {
            flashEl.style.transition = "none";
            flashEl.style.opacity = "1";
            setTimeout(() => { flashEl.style.transition = "opacity 1s ease-out"; flashEl.style.opacity = "0"; }, 50);
            
            drops.fill(0);
            speeds = Array.from({ length: columns }, () => Math.random() * 10 + 6);
            transitionActive = true;
        }
    });

    mainLoop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Alpha | Dreadnought Scale Fix</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --bg: #010103; }
        body { margin: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
        
        #game-wrapper { position: relative; width: 800px; height: 600px; border: 2px solid #333; overflow: hidden; background: #000; box-shadow: 0 0 100px #000; }
        
        /* Ship Canvas is behind UI */
        canvas { position: absolute; top: 0; left: 0; z-index: 10; image-rendering: pixelated; }
        
        .ui-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 50; 
            color: white; 
            pointer-events: none; 
        }

        #main-title {
            position: absolute;
            top: 140px;
            width: 100%;
            text-align: center;
            font-family: 'Cinzel Decorative', serif; font-size: 54px; letter-spacing: 12px; margin: 0;
            color: #fff; text-shadow: 0 0 15px #fff, 0 0 30px var(--cyan);
        }

        .menu-options { 
            position: absolute;
            top: 340px;
            left: 80px;
            pointer-events: all; 
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn { 
            background: none; border: none; color: rgba(255,255,255,0.4); font-size: 20px; padding: 10px 20px; cursor: pointer; 
            font-family: 'IBM Plex Mono', monospace; transition: 0.4s; letter-spacing: 4px; font-style: italic; 
            text-align: left; border-left: 0px solid var(--cyan);
        }
        .menu-btn:hover, .menu-btn.active { 
            color: #fff; text-shadow: 0 0 15px #fff; 
            transform: translateX(20px); 
            border-left: 6px solid var(--cyan); 
            background: linear-gradient(90deg, rgba(0,242,255,0.1), transparent); 
        }

        #crt-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%); background-size: 100% 3px; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="crt-overlay"></div>
    <canvas id="mainCanvas"></canvas>
    
    <div class="ui-layer">
        <h1 id="main-title">PROJECT ALPHA</h1>
        <div class="menu-options">
            <button class="menu-btn" data-action="new-game">INITIALIZE MISSION</button>
            <button class="menu-btn" data-action="settings">SYSTEM CONFIG</button>
            <button class="menu-btn" data-action="exit">TERMINATE</button>
        </div>
    </div>
</div>

<script>
const Engine = {
    canvas: document.getElementById('mainCanvas'),
    ctx: document.getElementById('mainCanvas').getContext('2d'),
    width: 800, height: 600, frame: 0,
    init() {
        this.canvas.width = this.width; this.canvas.height = this.height;
        MenuSystem.init();
        this.loop();
    },
    loop() {
        this.frame++;
        this.ctx.clearRect(0, 0, this.width, this.height);
        MenuSystem.draw(this.ctx);
        requestAnimationFrame(() => this.loop());
    }
};

const MenuSystem = {
    stars: [],
    shipX: 200, // Starting horizontal position

    init() {
        for(let i=0; i<120; i++) {
            this.stars.push({ x: Math.random()*800, y: Math.random()*600, s: Math.random()*2, v: Math.random()*0.2 });
        }
    },

    draw(ctx) {
        // 1. Space
        ctx.fillStyle = "#010105";
        ctx.fillRect(0, 0, 800, 600);

        // 2. Stars
        ctx.fillStyle = "#fff";
        this.stars.forEach(s => {
            s.y -= s.v; if(s.y < 0) s.y = 600;
            ctx.globalAlpha = 0.2;
            ctx.fillRect(s.x, s.y, s.s, s.s);
        });
        ctx.globalAlpha = 1.0;

        // 3. Move the ship
        this.shipX -= 0.4;
        if (this.shipX < -1500) this.shipX = 900;

        this.drawMassiveDreadnought(ctx, this.shipX, 280);
    },

    drawMassiveDreadnought(ctx, x, y) {
        const bob = Math.sin(Engine.frame * 0.01) * 12;
        ctx.save();
        ctx.translate(x, y + bob);
        
        // Scale everything up to simulate the "4x" feel
        ctx.scale(2.5, 2.5); 

        // ENGINE GLOW (Visible on the far left)
        const engineGlow = ctx.createLinearGradient(-100, 0, -300, 0);
        engineGlow.addColorStop(0, "rgba(0, 242, 255, 0.4)");
        engineGlow.addColorStop(1, "transparent");
        ctx.fillStyle = engineGlow;
        ctx.fillRect(-250, -20, 200, 60);

        // HULL SILHOUETTE
        ctx.fillStyle = "#111827";
        ctx.strokeStyle = "rgba(255,255,255,0.15)";
        ctx.lineWidth = 1;

        ctx.beginPath();
        // Massively long Battlecruiser silhouette
        ctx.moveTo(-200, 0);    // Back top
        ctx.lineTo(300, 0);     // Long spine top
        ctx.lineTo(350, -20);   // Upper Prow
        ctx.lineTo(400, 0);     // Nose Tip
        ctx.lineTo(400, 40);    // Nose Face
        ctx.lineTo(350, 60);    // Lower Prow
        ctx.lineTo(300, 40);    // Under Prow
        ctx.lineTo(-200, 40);   // Long spine bottom
        ctx.lineTo(-220, 60);   // Lower engine block
        ctx.lineTo(-250, 60);   // Back wall bottom
        ctx.lineTo(-250, -20);  // Back wall top
        ctx.lineTo(-220, -20);  // Upper engine block
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // DECK DETAILS (Glow strips)
        ctx.shadowBlur = 10;
        ctx.shadowColor = "cyan";
        ctx.fillStyle = "cyan";
        ctx.fillRect(360, 15, 30, 2); // Forward sensor
        ctx.fillRect(-230, 10, 20, 20); // Engine Core

        // AMBER WINDOWS (Command centers)
        ctx.shadowColor = "orange";
        ctx.fillStyle = "orange";
        ctx.fillRect(320, 5, 10, 5); // Main Bridge
        
        ctx.restore();
        ctx.shadowBlur = 0;
    }
};

// Handle button hover logic
document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.addEventListener('mouseenter', () => btn.classList.add('active'));
    btn.addEventListener('mouseleave', () => btn.classList.remove('active'));
});

Engine.init();
</script>
</body>
</html>

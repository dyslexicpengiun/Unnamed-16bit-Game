<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-bit RPG - Angled Pixel Drip Transition</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container { 
            position: relative; 
            width: 800px; 
            height: 600px; 
            border: 4px solid #444;
            overflow: hidden;
        }
        canvas { position: absolute; top: 0; left: 0; }
        #ui {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            text-shadow: 2px 2px #000;
        }
    </style>
</head>
<body>

<div id="ui">PRESS 'B' TO START ANGLED PIXEL DRIP BATTLE</div>

<div id="game-container">
    <!-- The "Target" scene (Battle) -->
    <canvas id="battleCanvas"></canvas>
    <!-- The "Current" scene (Overworld) -->
    <canvas id="worldCanvas"></canvas>
</div>

<script>
    const worldCanvas = document.getElementById('worldCanvas');
    const worldCtx = worldCanvas.getContext('2d');
    const battleCanvas = document.getElementById('battleCanvas');
    const battleCtx = battleCanvas.getContext('2d');

    const WIDTH = 800;
    const HEIGHT = 600;
    worldCanvas.width = battleCanvas.width = WIDTH;
    worldCanvas.height = battleCanvas.height = HEIGHT;

    // --- 1. RENDER MOCK SCENES ---
    function createScenes() {
        // Draw Town Scene
        worldCtx.fillStyle = '#b0e0e6'; // Sky Blue
        worldCtx.fillRect(0, 0, WIDTH, HEIGHT);
        worldCtx.fillStyle = '#6b8e23'; // Ground
        worldCtx.fillRect(0, HEIGHT - 100, WIDTH, 100);
        worldCtx.fillStyle = '#8b4513'; // Houses
        worldCtx.fillRect(100, HEIGHT - 200, 150, 100);
        worldCtx.fillRect(500, HEIGHT - 180, 150, 80);
        worldCtx.fillStyle = 'white';
        worldCtx.font = 'bold 30px monospace';
        worldCtx.fillText("--- PEACEFUL TOWN ---", 250, 150);

        // Draw Battle Scene (Hidden Beneath)
        battleCtx.fillStyle = '#444'; // Dungeon Gray
        battleCtx.fillRect(0, 0, WIDTH, HEIGHT);
        battleCtx.fillStyle = '#7a1a1a'; // Lava/Danger
        battleCtx.fillRect(0, HEIGHT - 50, WIDTH, 50);
        battleCtx.fillStyle = 'red';
        battleCtx.font = 'bold 30px monospace';
        battleCtx.fillText("--- BATTLE START: DUNGEON ---", 180, 100);
    }
    createScenes();

    // --- 2. ANGLED PIXEL DRIP LOGIC ---
    const stripHeight = 8; // Height of each horizontal "wind strip" in pixels
    const rows = Math.ceil(HEIGHT / stripHeight);
    // drops now tracks the X position of the "leading edge" of the drip for each row
    let dropsX = new Array(rows).fill(WIDTH); 
    const speeds = Array.from({ length: rows }, () => Math.random() * 8 + 4); 
    const angleSpeed = 15; // How much it shifts horizontally per vertical step
    let transitionActive = false;

    function animateDrip() {
        if (!transitionActive) return;

        let finished = true;

        for (let i = 0; i < rows; i++) {
            const currentX = dropsX[i];

            if (currentX > 0) {
                finished = false;
                
                const y = i * stripHeight;
                // Calculate how many pixels wide the "drip" should be this frame
                const dripWidth = speeds[i] + angleSpeed; 

                // Draw a slice of the battle canvas onto the world canvas
                worldCtx.drawImage(
                    battleCanvas,
                    currentX - dripWidth, y, dripWidth, stripHeight, // Source slice
                    currentX - dripWidth, y, dripWidth, stripHeight  // Destination position
                );

                // Move the starting X position of the drip to the left (wind effect)
                dropsX[i] -= speeds[i];
            }
        }

        if (!finished) {
            requestAnimationFrame(animateDrip);
        } else {
            transitionActive = false;
            console.log("Transition Complete!");
            // Ensure the battle canvas fully covers everything when done
            worldCtx.clearRect(0, 0, WIDTH, HEIGHT);
        }
    }

    // --- 3. TRIGGER ---
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'b' && !transitionActive) {
            createScenes(); // Reset the overworld
            dropsX.fill(WIDTH); // Start all drips at the far right
            speeds = Array.from({ length: rows }, () => Math.random() * 6 + 4);
            transitionActive = true;
            animateDrip();
        }
    });

</script>
</body>
</html>

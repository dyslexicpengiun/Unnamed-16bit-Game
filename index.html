<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-bit 2D-HD Transition</title>
    <style>
        body { margin: 0; background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 600px; border: 2px solid #222; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 20; color: #eee; font-family: 'Courier New', monospace; pointer-events: none; text-shadow: 2px 2px #000; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="ui">PRESS 'B' FOR 2D-HD BATTLE TRANSITION</div>

<div id="game-container">
    <canvas id="battleCanvas"></canvas>
    <canvas id="worldCanvas"></canvas>
</div>

<script>
    const worldCanvas = document.getElementById('worldCanvas');
    const worldCtx = worldCanvas.getContext('2d');
    const battleCanvas = document.getElementById('battleCanvas');
    const battleCtx = battleCanvas.getContext('2d');

    const WIDTH = 800;
    const HEIGHT = 600;
    worldCanvas.width = battleCanvas.width = WIDTH;
    worldCanvas.height = battleCanvas.height = HEIGHT;

    let frame = 0;
    let transitionActive = false;
    let transitionProgress = 0;

    // --- 1. ENTITY DATA ---
    const townNPCs = [
        { x: 200, y: 450, color: '#ffccaa', name: 'Villager' },
        { x: 550, y: 420, color: '#aaccff', name: 'Merchant' }
    ];

    const enemies = [
        { x: 400, y: 300, color: '#ff4444', size: 60, name: 'BOSS' }
    ];

    const particles = Array.from({ length: 40 }, () => ({
        x: Math.random() * WIDTH,
        y: Math.random() * HEIGHT,
        s: Math.random() * 2 + 1,
        v: Math.random() * 0.5 + 0.2
    }));

    // --- 2. THE "HD" RENDERER ---
    function drawHDScene(ctx, type) {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        // A. Backgrounds
        if (type === 'town') {
            ctx.fillStyle = '#3e8948'; // Grass
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = '#555'; // Path
            ctx.fillRect(0, 430, WIDTH, 40);
        } else {
            ctx.fillStyle = '#1a120c'; // Dark Dungeon
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            // Vignette for HD feel
            const grad = ctx.createRadialGradient(WIDTH/2, HEIGHT/2, 100, WIDTH/2, HEIGHT/2, 500);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.8)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }

        // B. Anchored Shadows & Bobbing Characters
        const list = (type === 'town') ? townNPCs : enemies;
        list.forEach(char => {
            const bob = Math.sin(frame * 0.1) * 5;
            
            // Anchored Shadow (Oval)
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(char.x + 20, char.y + 45, 20, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Character Body
            ctx.fillStyle = char.color;
            ctx.fillRect(char.x, char.y + bob, 40, 45);
        });

        // C. Pixel Embers (Particulates)
        ctx.fillStyle = (type === 'town') ? 'rgba(255,255,255,0.2)' : 'rgba(255,100,0,0.4)';
        particles.forEach(p => {
            p.y -= p.v;
            if (p.y < 0) p.y = HEIGHT;
            ctx.fillRect(p.x, p.y, p.s, p.s);
        });
    }

    // --- 3. THE TRANSITION ---
    const stripWidth = 10;
    const columns = Math.ceil(WIDTH / stripWidth);
    let drops = new Array(columns).fill(0);
    let speeds = new Array(columns).fill(0);

    function loop() {
        frame++;
        
        // Always render the battle scene to its hidden buffer
        drawHDScene(battleCtx, 'battle');

        if (!transitionActive) {
            // Normal world render
            drawHDScene(worldCtx, 'town');
        } else {
            // Apply the "Drip" by painting Battle over World
            for (let i = 0; i < columns; i++) {
                if (drops[i] < HEIGHT) {
                    const x = i * stripWidth;
                    // Draw slice from battle buffer to world canvas
                    worldCtx.drawImage(
                        battleCanvas,
                        x, drops[i], stripWidth, speeds[i] + 5,
                        x, drops[i], stripWidth, speeds[i] + 5
                    );
                    drops[i] += speeds[i];
                }
            }
        }
        requestAnimationFrame(loop);
    }

    // --- 4. TRIGGER ---
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'b' && !transitionActive) {
            drops.fill(0);
            speeds = Array.from({ length: columns }, () => Math.random() * 10 + 5);
            transitionActive = true;
            console.log("Entering Battle...");
        }
    });

    loop();
</script>
</body>
</html>

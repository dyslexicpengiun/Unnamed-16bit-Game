<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-bit RPG - Pixel Drip Transition</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container { 
            position: relative; 
            width: 800px; 
            height: 600px; 
            border: 4px solid #444;
            overflow: hidden;
        }
        /* Layering: Battle is background, World is top, Canvas handles the "melt" */
        canvas { position: absolute; top: 0; left: 0; }
        #ui {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            text-shadow: 2px 2px #000;
        }
    </style>
</head>
<body>

<div id="ui">PRESS 'B' TO START PIXEL DRIP BATTLE</div>

<div id="game-container">
    <!-- The "Target" scene (Battle) -->
    <canvas id="battleCanvas"></canvas>
    <!-- The "Current" scene (Overworld) -->
    <canvas id="worldCanvas"></canvas>
</div>

<script>
    const worldCanvas = document.getElementById('worldCanvas');
    const worldCtx = worldCanvas.getContext('2d');
    const battleCanvas = document.getElementById('battleCanvas');
    const battleCtx = battleCanvas.getContext('2d');

    const WIDTH = 800;
    const HEIGHT = 600;
    worldCanvas.width = battleCanvas.width = WIDTH;
    worldCanvas.height = battleCanvas.height = HEIGHT;

    // --- 1. RENDER MOCK SCENES ---
    function createScenes() {
        // Draw Overworld (Green with "trees")
        worldCtx.fillStyle = '#3e8948'; 
        worldCtx.fillRect(0, 0, WIDTH, HEIGHT);
        worldCtx.fillStyle = '#2d5e2d';
        for(let i=0; i<20; i++) worldCtx.fillRect(Math.random()*WIDTH, Math.random()*HEIGHT, 40, 40);
        worldCtx.fillStyle = 'white';
        worldCtx.font = 'bold 30px monospace';
        worldCtx.fillText("--- OVERWORLD ---", 260, 300);

        // Draw Battle Scene (Dark with "enemies")
        battleCtx.fillStyle = '#1a1a1a'; 
        battleCtx.fillRect(0, 0, WIDTH, HEIGHT);
        battleCtx.fillStyle = '#7a1a1a';
        battleCtx.fillRect(350, 200, 100, 150); // Boss
        battleCtx.fillStyle = 'red';
        battleCtx.font = 'bold 30px monospace';
        battleCtx.fillText("--- BATTLE START ---", 250, 100);
    }
    createScenes();

    // --- 2. PIXEL DRIP LOGIC ---
    const stripWidth = 8; // Adjust for "chunkiness"
    const columns = Math.ceil(WIDTH / stripWidth);
    let drops = new Array(columns).fill(0);
    let speeds = new Array(columns).fill(0);
    let transitionActive = false;

    function animateDrip() {
        if (!transitionActive) return;

        let finished = true;

        for (let i = 0; i < columns; i++) {
            if (drops[i] < HEIGHT) {
                finished = false;
                
                const x = i * stripWidth;
                const currentY = drops[i];
                const speed = speeds[i];

                // Draw a slice of the battle canvas onto the world canvas
                // This "replaces" the overworld pixels with battle pixels
                worldCtx.drawImage(
                    battleCanvas,
                    x, currentY, stripWidth, speed + 2, // Source slice
                    x, currentY, stripWidth, speed + 2  // Destination position
                );

                drops[i] += speed;
            }
        }

        if (!finished) {
            requestAnimationFrame(animateDrip);
        } else {
            transitionActive = false;
            console.log("Transition Complete!");
        }
    }

    // --- 3. TRIGGER ---
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'b' && !transitionActive) {
            // Re-render world in case we already transitioned
            createScenes(); 
            
            // Randomize speeds for this specific transition
            drops.fill(0);
            speeds = Array.from({ length: columns }, () => Math.random() * 8 + 4);
            
            transitionActive = true;
            animateDrip();
        }
    });

</script>
</body>
</html>

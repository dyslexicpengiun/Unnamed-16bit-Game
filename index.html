<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-bit RPG | HD Gallery</title>
    <style>
        body { margin: 0; background: #010101; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
        #shake-wrapper { position: relative; width: 800px; height: 600px; }
        #game-container { position: relative; width: 100%; height: 100%; border: 2px solid #333; overflow: hidden; background: #000; box-shadow: 0 0 100px rgba(0,0,0,1); }
        canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
        
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; transition: opacity 0.5s ease; color: white; background: rgba(0,0,0,0.95); }
        .hidden { opacity: 0; pointer-events: none; }
        
        /* Title and Instructions */
        .menu-title { font-size: 40px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 5px; }
        .controls-hint { position: absolute; bottom: 30px; font-size: 14px; opacity: 0.6; }
        
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

<div id="shake-wrapper">
    <div id="game-container">
        <div id="flash"></div>
        
        <!-- START SCREEN -->
        <div id="start-screen" class="ui-overlay">
            <h1 class="menu-title">UNNAMED RPG</h1>
            <button class="btn" onclick="showCharacterSelect()">PRESS START</button>
        </div>

        <!-- CHARACTER SELECT (Visuals handled by Canvas) -->
        <div id="char-select" class="ui-overlay hidden" style="background: transparent;">
            <div class="controls-hint">USE ARROWS TO ROTATE | [ENTER] TO CHOOSE</div>
        </div>

        <canvas id="battleCanvas"></canvas>
        <canvas id="worldCanvas"></canvas>
        <canvas id="uiCanvas"></canvas> <!-- New layer for the Spotlight/Gallery UI -->
    </div>
</div>

<script>
    const uiCanvas = document.getElementById('uiCanvas');
    const uiCtx = uiCanvas.getContext('2d');
    const worldCanvas = document.getElementById('worldCanvas');
    const worldCtx = worldCanvas.getContext('2d');
    const battleCanvas = document.getElementById('battleCanvas');
    const battleCtx = battleCanvas.getContext('2d');
    const flashEl = document.getElementById('flash');
    const shakeWrapper = document.getElementById('shake-wrapper');

    const startScreen = document.getElementById('start-screen');
    const charSelect = document.getElementById('char-select');

    const WIDTH = 800; const HEIGHT = 600;
    [uiCanvas, worldCanvas, battleCanvas].forEach(c => { c.width = WIDTH; c.height = HEIGHT; });

    let gameState = "MENU";
    let frame = 0;
    let inBattle = false;
    let transitionActive = false;
    let shakePower = 0;

    // --- GALLERY DATA ---
    const heroes = [
        { name: "WARRIOR", color: "#ffccaa", bio: "Strength & Honor", h: 30 },
        { name: "MAGE", color: "#aaccff", bio: "Arcane Mastery", h: 210 },
        { name: "ROGUE", color: "#ccffaa", bio: "Shadow Stalker", h: 120 },
        { name: "PALADIN", color: "#ffeeaa", bio: "Divine Shield", h: 50 }
    ];
    let selectedHeroIndex = 0;
    let targetRotation = 0;
    let currentRotation = 0;

    function showCharacterSelect() {
        gameState = "CHAR_SELECT";
        startScreen.classList.add('hidden');
        charSelect.classList.remove('hidden');
    }

    function startGame() {
        gameState = "PLAYING";
        charSelect.classList.add('hidden');
        flashEl.style.opacity = "1";
        setTimeout(() => { flashEl.style.transition = "opacity 1s"; flashEl.style.opacity = "0"; }, 50);
    }

    // --- RENDERING GALLERY ---
    function drawGallery() {
        uiCtx.clearRect(0, 0, WIDTH, HEIGHT);
        
        // Darkened Background for Select Screen
        uiCtx.fillStyle = "rgba(0,0,0,0.85)";
        uiCtx.fillRect(0,0,WIDTH,HEIGHT);

        // Calculate Rotation Smoothing
        currentRotation += (targetRotation - currentRotation) * 0.1;

        // Spotlight Effect
        const grad = uiCtx.createRadialGradient(WIDTH/2, HEIGHT/2, 50, WIDTH/2, HEIGHT/2, 300);
        grad.addColorStop(0, "rgba(255,255,255,0.05)");
        grad.addColorStop(1, "rgba(0,0,0,0.9)");
        uiCtx.fillStyle = grad;
        uiCtx.fillRect(0,0,WIDTH,HEIGHT);

        heroes.forEach((hero, i) => {
            // Circle math for the "Isaac" rotation
            const angle = (i * (Math.PI * 2 / heroes.length)) + currentRotation;
            const x = WIDTH/2 + Math.sin(angle) * 250;
            const z = Math.cos(angle); // Use Z for depth scaling
            const y = HEIGHT/2 + z * 50;
            
            const scale = (z + 2) / 2; // 0.5 to 1.5
            const size = 50 * scale;
            const alpha = (z + 1) / 2; // Fade out back heroes

            // Draw Hero Sprite
            uiCtx.globalAlpha = alpha;
            uiCtx.fillStyle = hero.color;
            uiCtx.shadowBlur = i === selectedHeroIndex ? 20 : 0;
            uiCtx.shadowColor = hero.color;
            uiCtx.fillRect(x - size/2, y - size/2, size, size);
            
            // Draw Name under selected hero
            if (i === selectedHeroIndex && Math.abs(targetRotation - currentRotation) < 0.1) {
                uiCtx.globalAlpha = 1;
                uiCtx.fillStyle = "white";
                uiCtx.font = "bold 24px monospace";
                uiCtx.textAlign = "center";
                uiCtx.fillText(hero.name, WIDTH/2, HEIGHT/2 + 150);
                uiCtx.font = "14px monospace";
                uiCtx.fillText(hero.bio, WIDTH/2, HEIGHT/2 + 180);
            }
        });
        uiCtx.shadowBlur = 0;
        uiCtx.globalAlpha = 1;
    }

    function mainLoop() {
        frame++;
        if (gameState === "CHAR_SELECT") {
            drawGallery();
        } else if (gameState === "PLAYING" || gameState === "BATTLE" || transitionActive) {
            // (Standard Town/Battle logic here)
            // ... truncated for brevity ...
        }
        requestAnimationFrame(mainLoop);
    }

    window.addEventListener('keydown', (e) => {
        if (gameState === "CHAR_SELECT") {
            if (e.key === "ArrowLeft") {
                selectedHeroIndex = (selectedHeroIndex - 1 + heroes.length) % heroes.length;
                targetRotation += (Math.PI * 2 / heroes.length);
            }
            if (e.key === "ArrowRight") {
                selectedHeroIndex = (selectedHeroIndex + 1) % heroes.length;
                targetRotation -= (Math.PI * 2 / heroes.length);
            }
            if (e.key === "Enter") startGame();
        }
        // (Existing 'B' and 'R' keys)
    });

    mainLoop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-bit 2D-HD Final</title>
    <style>
        body { margin: 0; background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 600px; border: 2px solid #222; overflow: hidden; background: #000; }
        canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 100; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 20; color: #eee; font-family: 'Courier New', monospace; pointer-events: none; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>

<div id="ui">PRESS 'B' FOR HD TRANSITION</div>
<div id="game-container">
    <div id="flash"></div>
    <canvas id="battleCanvas"></canvas>
    <canvas id="worldCanvas"></canvas>
</div>

<script>
    const worldCanvas = document.getElementById('worldCanvas');
    const worldCtx = worldCanvas.getContext('2d');
    const battleCanvas = document.getElementById('battleCanvas');
    const battleCtx = battleCanvas.getContext('2d');
    const flashEl = document.getElementById('flash');

    const WIDTH = 800; const HEIGHT = 600;
    worldCanvas.width = battleCanvas.width = WIDTH;
    worldCanvas.height = battleCanvas.height = HEIGHT;

    let frame = 0;
    let transitionActive = false;
    const stripWidth = 8;
    const columns = Math.ceil(WIDTH / stripWidth);
    let drops = new Array(columns).fill(0);
    let speeds = new Array(columns).fill(0);

    // --- HD ASSETS ---
    const townNPCs = [{ x: 200, y: 450, color: '#ffccaa' }, { x: 550, y: 420, color: '#aaccff' }];
    const particles = Array.from({ length: 40 }, () => ({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, v: Math.random() * 0.5 + 0.2 }));

    function drawScene(ctx, type) {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        // Backgrounds
        ctx.fillStyle = type === 'town' ? '#3e8948' : '#1a120c';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        
        // Anchored Shadows & Bobbing
        const chars = type === 'town' ? townNPCs : [{ x: 380, y: 280, color: '#ff4444' }];
        chars.forEach(c => {
            const bob = Math.sin(frame * 0.15) * 4;
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; // Shadow
            ctx.beginPath(); ctx.ellipse(c.x + 20, c.y + 45, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = c.color; // Sprite
            ctx.fillRect(c.x, c.y + bob, 40, 45);
        });

        // Embers
        ctx.fillStyle = type === 'town' ? 'rgba(255,255,255,0.3)' : 'rgba(255,100,0,0.5)';
        particles.forEach(p => { p.y -= p.v; if (p.y < 0) p.y = HEIGHT; ctx.fillRect(p.x, p.y, 2, 2); });
    }

    function mainLoop() {
        frame++;
        drawScene(battleCtx, 'battle'); // Prep the hidden scene

        if (!transitionActive) {
            drawScene(worldCtx, 'town'); // Regular world rendering
        } else {
            // Apply Drip: We DON'T clear worldCtx here so the "slices" stick
            for (let i = 0; i < columns; i++) {
                if (drops[i] < HEIGHT) {
                    const x = i * stripWidth;
                    worldCtx.drawImage(battleCanvas, x, drops[i], stripWidth, speeds[i] + 2, x, drops[i], stripWidth, speeds[i] + 2);
                    drops[i] += speeds[i];
                }
            }
        }
        requestAnimationFrame(mainLoop);
    }

    // --- KEYBOARD TRIGGER ---
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'b' && !transitionActive) {
            // 1. Trigger Flash
            flashEl.style.opacity = "1";
            setTimeout(() => { flashEl.style.transition = "opacity 0.5s"; flashEl.style.opacity = "0"; }, 50);
            
            // 2. Setup Drip
            drops.fill(0);
            speeds = Array.from({ length: columns }, () => Math.random() * 8 + 4);
            transitionActive = true;
        }
    });

    mainLoop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-bit RPG - Perfect Transition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #game-container { position: relative; width: 800px; height: 600px; margin: auto; }
        
        /* The "Old" Scene */
        #world-layer { position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* The "New" Scene (Hidden underneath) */
        #battle-layer { position: absolute; top: 0; left: 0; z-index: 0; }

        /* The Masking Canvas */
        #transition-canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 2; 
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Battle scene is already there, just waiting behind -->
    <canvas id="battle-layer"></canvas>
    <!-- World scene is on top -->
    <canvas id="world-layer"></canvas>
    <!-- Masking layer -->
    <canvas id="transition-canvas"></canvas>
</div>

<script>
    const worldCanvas = document.getElementById('world-layer');
    const worldCtx = worldCanvas.getContext('2d');
    const battleCanvas = document.getElementById('battle-layer');
    const battleCtx = battleCanvas.getContext('2d');
    const tCanvas = document.getElementById('transition-canvas');
    const tCtx = tCanvas.getContext('2d');

    [worldCanvas, battleCanvas, tCanvas].forEach(c => { c.width = 800; c.height = 600; });

    // --- SETUP SCENES ---
    function setupScenes() {
        // Draw Overworld
        worldCtx.fillStyle = '#2d5e2d'; 
        worldCtx.fillRect(0,0,800,600);
        worldCtx.fillStyle = 'white';
        worldCtx.font = '30px Arial';
        worldCtx.fillText("OVERWORLD (Current Scene)", 200, 300);

        // Draw Battle (Hidden Beneath)
        battleCtx.fillStyle = '#444';
        battleCtx.fillRect(0,0,800,600);
        battleCtx.fillStyle = 'red';
        battleCtx.fillText("BATTLE (New Scene)", 250, 300);
    }
    setupScenes();

    // --- MATRIX MASK LOGIC ---
    const fontSize = 18;
    const columns = tCanvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(0);
    let transitionActive = false;

    function dripTransition() {
        if (!transitionActive) return;

        // The Magic Part: This makes the drops "erase" the top layer
        worldCtx.globalCompositeOperation = 'destination-out';
        
        worldCtx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            // Pick a random char
            const text = String.fromCharCode(0x30A0 + Math.random() * 96);
            
            // Draw the char on the WORLD canvas using destination-out 
            // This creates the transparent "holes" that reveal the battle layer
            worldCtx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > tCanvas.height && Math.random() > 0.95) {
                drops[i] = 0;
            }
            drops[i]++;
        }

        requestAnimationFrame(dripTransition);
    }

    // Trigger on Key 'B'
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'b' && !transitionActive) {
            transitionActive = true;
            dripTransition();
            
            // Clean up after it's fully revealed
            setTimeout(() => {
                transitionActive = false;
                worldCtx.clearRect(0,0,800,600); // Fully clear top layer
                console.log("Transition Complete");
            }, 4000);
        }
    });

</script>
</body>
</html>

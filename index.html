<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Alpha | 2D-HD Space RPG</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root { 
            --glow: #fff; 
            --bg: #020205; 
            --accent: rgba(0, 150, 255, 0.8);
        }

        body { 
            margin: 0; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Courier New', monospace; 
        }
        
        #game-wrapper { 
            position: relative; 
            width: 800px; 
            height: 600px; 
            border: 2px solid #333; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 0 100px #000; 
        }

        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            image-rendering: pixelated; 
        }

        /* CRT Scanline Overlay */
        #crt-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 3px 100%; 
            pointer-events: none; 
            z-index: 100; 
        }

        /* UI State Layers */
        .ui-layer { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 50; 
            color: white; 
            transition: opacity 1s ease;
        }

        .hidden { opacity: 0; pointer-events: none; }

        /* Octopath Style Menu Buttons */
        .menu-options { 
            margin-top: 60px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        .menu-btn { 
            background: none; 
            border: none; 
            color: rgba(255,255,255,0.5); 
            font-size: 22px; 
            padding: 10px 40px; 
            cursor: pointer; 
            font-family: 'IBM Plex Mono', monospace; 
            transition: 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67); 
            letter-spacing: 4px; 
            font-style: italic;
            text-align: left;
            width: 300px;
        }

        .menu-btn:hover { 
            color: #fff; 
            text-shadow: 0 0 15px #fff; 
            transform: translateX(15px); 
        }

        .menu-btn.active { 
            color: #fff; 
            text-shadow: 0 0 20px #fff; 
            border-left: 3px solid #fff;
        }

        #main-title {
            font-family: 'Cinzel Decorative', serif; 
            font-size: 54px; 
            letter-spacing: 14px; 
            margin: 0;
            text-shadow: 0 0 25px rgba(255,255,255,0.4), 0 2px 5px #000;
            z-index: 60;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="crt-overlay"></div>
    <canvas id="mainCanvas"></canvas>

    <div id="menu-layer" class="ui-layer">
        <h1 id="main-title">PROJECT ALPHA</h1>
        <div class="menu-options">
            <button class="menu-btn" data-action="new-game">START JOURNEY</button>
            <button class="menu-btn" data-action="settings">OPTIONS</button>
            <button class="menu-btn" data-action="exit">EXIT</button>
        </div>
    </div>
</div>

<script>
/**
 * CORE ENGINE MODULE
 * Manages the main game loop and global states.
 */
const Engine = {
    canvas: document.getElementById('mainCanvas'),
    ctx: document.getElementById('mainCanvas').getContext('2d'),
    width: 800, 
    height: 600, 
    state: 'MENU', 
    frame: 0,
    
    init() {
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        MenuSystem.init();
        this.loop();
    },
    
    loop() {
        this.frame++;
        this.ctx.clearRect(0, 0, this.width, this.height);
        
        // State Machine Rendering
        switch(this.state) {
            case 'MENU':
                MenuSystem.draw(this.ctx);
                break;
            // Additional states (CHAR_SELECT, WORLD) will be added here
        }
        
        requestAnimationFrame(() => this.loop());
    }
};

/**
 * MENU SYSTEM MODULE
 * Handles procedural space background and spaceship crest.
 */
const MenuSystem = {
    stars: [],
    nebulas: [],

    init() {
        // Create Star Field
        for(let i=0; i<180; i++) {
            this.stars.push({
                x: Math.random() * 800,
                y: Math.random() * 600,
                size: Math.random() * 2 + 0.5,
                blink: Math.random() * 10,
                v: Math.random() * 0.3 + 0.1
            });
        }
        // Create Nebula Clouds
        this.nebulas = [
            { x: 150, y: 150, color: 'rgba(0, 100, 255, 0.08)', r: 350 },
            { x: 650, y: 450, color: 'rgba(200, 0, 100, 0.08)', r: 400 },
            { x: 400, y: 300, color: 'rgba(100, 0, 255, 0.05)', r: 500 }
        ];
    },

    draw(ctx) {
        // 1. Background Fill
        ctx.fillStyle = "#020208";
        ctx.fillRect(0,0,800,600);

        // 2. Draw Procedural Nebulas
        this.nebulas.forEach(n => {
            const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
            grad.addColorStop(0, n.color);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 800, 600);
        });

        // 3. Draw Twinkling Star Dust
        ctx.fillStyle = "#fff";
        this.stars.forEach(s => {
            s.y -= s.v; // Drift up
            if(s.y < 0) s.y = 600;
            
            const alpha = 0.2 + Math.abs(Math.sin(s.blink + Engine.frame * 0.02)) * 0.8;
            ctx.globalAlpha = alpha;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        });
        ctx.globalAlpha = 1.0;

        // 4. Draw The Spaceship Crest (Centered behind title)
        this.drawSpaceship(ctx);
    },

    drawSpaceship(ctx) {
        ctx.save();
        ctx.translate(400, 250); // Position behind title
        ctx.rotate(-Math.PI / 12); // Octopath Style Tilt

        // Engine Thrust Glow
        const thrust = ctx.createRadialGradient(0, 50, 0, 0, 50, 60);
        thrust.addColorStop(0, "rgba(0, 200, 255, 0.5)");
        thrust.addColorStop(1, "transparent");
        ctx.fillStyle = thrust;
        ctx.fillRect(-60, -20, 120, 100);

        // Ship Hull
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
        ctx.lineWidth = 2;
        
        ctx.beginPath();
        ctx.moveTo(0, -70);      // Nose
        ctx.lineTo(25, 10);      // Right wing inner
        ctx.lineTo(55, 45);      // Right wing tip
        ctx.lineTo(15, 30);      // Right thruster outer
        ctx.lineTo(0, 45);       // Rear center
        ctx.lineTo(-15, 30);     // Left thruster outer
        ctx.lineTo(-55, 45);     // Left wing tip
        ctx.lineTo(-25, 10);     // Left wing inner
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Cockpit Glow
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#fff";
        ctx.fillStyle = "#fff";
        ctx.fillRect(-3, -35, 6, 12);

        // Thruster Emitters (Neon Blue)
        ctx.shadowBlur = 10;
        ctx.shadowColor = "cyan";
        ctx.fillStyle = "cyan";
        ctx.fillRect(-18, 32, 6, 6);
        ctx.fillRect(12, 32, 6, 6);

        ctx.restore();
    }
};

// UI Interaction Logic
document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.addEventListener('mouseenter', () => btn.classList.add('active'));
    btn.addEventListener('mouseleave', () => btn.classList.remove('active'));
    btn.addEventListener('click', (e) => {
        const action = e.target.dataset.action;
        console.log("Action Triggered:", action);
        // Add scene transition logic here
    });
});

// Boot Engine
Engine.init();

</script>
</body>
</html>
